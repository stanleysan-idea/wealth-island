<style>
/* Layout: one iOS column (max 520px) · sticky frosted title bar · tab views (島嶼 / 帳本 / 報表 / 資產) · fixed frosted tab bar with a raised record button */
:root{
  --up:#DD3F33; --down:#1E9653;
  --bg:#FBF7F0; --surface:#FFFFFF; --surface-2:#F7F2EA; --bar:rgba(251,247,240,.86); --glass:rgba(255,255,255,.76);
  --ink:#2A2721; --ink-2:#5C564C; --ink-3:#857D70; --line:#ECE4D8; --scrim:rgba(45,35,25,.32);
  --emerald:#16905E; --emerald-deep:#0E7149; --on-em:#FFFFFF; --emerald-soft:#E0F2E7; --emerald-shadow:rgba(22,144,94,.28);
  --sky:#3F97D6; --sky-soft:#E3F0FA; --wood:#A8703F; --wood-soft:#F5E9DA;
  --coral:#DB6450; --coral-soft:#FBE8E2; --debt:#857F78; --debt-soft:#EFEAE3; --amber:#C27A12;
  --c1:#2F7FD0; --c2:#D9741C;   /* chart pair (validated: CVD-safe on light surface) */
  --fs:1.12;   /* text size: 標準 1 · 大 1.12 · 特大 1.25, picked in 設定 and kept per device */
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  --font-num:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,"Noto Sans TC",system-ui,sans-serif;
  /* island scene: cozy, outlined, seen from above */
  --sky-top:#8ED3F5; --sky-bot:#D6F0FA; --sea-top:#63CBE0; --sea-bot:#3FA6CC; --shallow:#9FE5E1; --foam:rgba(255,255,255,.85);
  --sand:#F5E4B6; --sand-dk:#E2C98E; --soil-top:#C99567; --soil-bot:#A9744B; --grass:#8ED16E; --grass-hi:#AEE28F; --grass-lo:#67B455;
  --tree:#5DB451; --tree-hi:#8CD16E; --tree-dk:#3B8C3E; --trunk:#9A6B45; --fruit:#F48C4E; --shade:rgba(70,90,40,.22);
  --sun:#FFD86B; --sun-glow:rgba(255,216,107,.3); --cloud:#FFFFFF; --cloud-sh:#E3F1F8;
  --ol:#6E5136; --wall:#FFF4DF; --roof:#E3795E; --roof-dk:#C45F46; --door:#B9804F; --window:#A3DDF5; --found:#C9C2B4; --found-line:#9C9384;
  --mill:#FFF4DF; --turbine:#FFFFFF; --turbine-dim:#D6CEC0; --hub:#7A5A3C; --lh-band:#E36B5B; --gift:#FFF8EC;
  --pine:#47A35C; --pine-dk:#2F7D46; --pine-hi:#6FC27A; --bush:#5AB34F; --fence:#FFFDF5; --path:#EFDBAA; --path-dk:#D7BB83;
  --fire:#FF9A3C; --fire-in:#FFE07A; --log:#A86F43; --log-in:#ECC690; --hill-far:#BCE5C8; --hill-tree:#8DCDA0;
  --rope:rgba(110,81,54,.55); --water:#5EC6EE; --mud:#C9A87C; --stone:#D9D3C6; --rock:#A9ADB4; --rock-hi:#CDD0D5;
  --tag-bg:rgba(255,255,255,.9); --tag-fg:#2A2721; --hi:#FFFFFF;
  color-scheme:light;   /* always the bright theme, even when the phone is in dark mode */
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:calc(15px*var(--fs));line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
/* no visible scrollbars on inner scrollers */
*{scrollbar-width:none} *::-webkit-scrollbar{display:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:-.01em}
.muted{color:var(--ink-3)}
.pos{color:var(--emerald)} .neg{color:var(--coral)}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--ink-3)}   /* prices and gains: red up, green down, as Taiwan brokers show them */

/* top bar */
.topbar{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:15;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid transparent;transition:border-color .2s}
.topbar.scrolled{border-bottom-color:var(--line)}
.topbar-in{max-width:520px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px}
.topbar h1{font-size:calc(26px*var(--fs));font-weight:800;letter-spacing:-.02em;line-height:1.15}
.topbar .sub{font-size:calc(12px*var(--fs));color:var(--ink-3);font-weight:500}
.topbar .grow1{flex:1;min-width:0}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--ink-2);border:1px solid var(--line);flex-shrink:0}

main{max-width:520px;margin:0 auto;padding-block:6px calc(110px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:6px 4px 0}
.sec-title h2{font-size:calc(17px*var(--fs));font-weight:700}
.sec-title .link{font-size:calc(13px*var(--fs));color:var(--emerald);font-weight:600}
.lbl{font-size:calc(12px*var(--fs));color:var(--ink-3);font-weight:600;letter-spacing:.04em}
.cur{font-size:.6em;font-weight:700;color:var(--ink-3);margin-right:2px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:calc(11.5px*var(--fs));font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.green{background:var(--emerald-soft);color:var(--emerald)}
.pill.grey{background:var(--debt-soft);color:var(--debt)}
.pill.coral{background:var(--coral-soft);color:var(--coral)}
.badge{display:inline-block;font-size:calc(10px*var(--fs));font-weight:700;padding:1px 6px;border-radius:999px;background:var(--surface-2);color:var(--ink-3);vertical-align:2px;margin-left:4px}

/* hint card */
.hint-card{display:flex;gap:12px;align-items:center;background:var(--wood-soft);border-radius:18px;padding:12px 14px;font-size:calc(13px*var(--fs));color:var(--ink-2)}
.hint-card p{flex:1;min-width:0}
.hint-card b{color:var(--ink)}
.mini-btn{flex-shrink:0;font-size:calc(12.5px*var(--fs));font-weight:700;padding:7px 11px;border-radius:999px;background:var(--surface);color:var(--wood);border:1px solid var(--line)}

/* KPI */
.kpi{display:flex;flex-direction:column;gap:14px}
.kpi-net{display:flex;flex-direction:column;gap:2px}
.kpi-net .num{font-size:calc(36px*var(--fs));line-height:1.1}
.kpi-net .cur{font-size:.5em;margin-right:3px}
.krow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi-tile{background:var(--surface-2);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi-tile .num{font-size:calc(18px*var(--fs));letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi-tile .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}

/* island */
.island{position:relative;border-radius:24px;overflow:hidden;border:1px solid var(--line);background:var(--sky-bot);box-shadow:0 10px 30px -18px rgba(20,60,40,.45)}
.island svg{display:block;width:100%;height:auto;max-width:100%}
.island canvas.island3d{display:block;width:100%;aspect-ratio:360/250;touch-action:pan-y;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.island.is3d>svg{display:none}   /* the SVG island stays in the page as the fallback */
.i3-ctl{position:absolute;right:8px;top:8px;z-index:2;display:flex;gap:6px}
.i3-ctl button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 17px/1 var(--font);color:var(--ink);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 2px 8px -4px rgba(0,0,0,.3)}
.i3-hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:2;width:max-content;max-width:calc(100% - 24px);padding:7px 12px;border-radius:14px;font-size:calc(12.5px*var(--fs));font-weight:700;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);pointer-events:none;animation:fadeout 5.2s ease-in both}
@keyframes fadeout{0%,80%{opacity:1}100%{opacity:0}}
.island .chip-tl{position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:6px;font-size:calc(12px*var(--fs));font-weight:700;padding:6px 10px;border-radius:999px;background:var(--glass);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);color:var(--ink)}
.island .chip-tl i{width:8px;height:8px;border-radius:50%;background:var(--emerald)}
.island .empty-tip{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);font-size:calc(12.5px*var(--fs));font-weight:600;text-align:center;padding:8px 12px;border-radius:14px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:-4px}
.legend button,.legend .chip{display:inline-flex;align-items:center;gap:6px;font-size:calc(12px*var(--fs));font-weight:600;color:var(--ink-2);padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.legend .sw{width:8px;height:8px;border-radius:2px}

.obj{cursor:pointer}
.gw{transform-box:fill-box;transform-origin:50% 100%}
.grow{animation:grow .7s cubic-bezier(.2,1.3,.4,1) both}
.fadein{animation:fadein .8s ease both}
@keyframes grow{from{transform:scale(.01)}to{transform:scale(1)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
[data-ak]{transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.spin{animation:spin linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cloud{animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-90px)}to{transform:translateX(440px)}}
.wave{animation:wave 6s linear infinite}
.wave.b{animation-duration:9s;animation-direction:reverse}
@keyframes wave{from{transform:translateX(-40px)}to{transform:translateX(0)}}
.water-wave{animation:wave2 2.4s linear infinite}
@keyframes wave2{from{transform:translateX(-10px)}to{transform:translateX(0)}}
.sway{animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.float{animation:float 7s ease-in-out infinite}
@keyframes float{0%,100%{transform:translate(0,0)}33%{transform:translate(4px,-6px)}66%{transform:translate(-3px,-2px)}}
.smoke circle{animation:smoke 3.6s ease-out infinite;opacity:0;transform-box:fill-box;transform-origin:center}
.smoke circle:nth-child(2){animation-delay:1.2s}.smoke circle:nth-child(3){animation-delay:2.4s}
@keyframes smoke{0%{opacity:.55;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(6px,-16px) scale(1.6)}}
.drip{animation:drip 1.6s ease-in infinite;opacity:0}
.drip:nth-of-type(2){animation-delay:.55s}.drip:nth-of-type(3){animation-delay:1.1s}
@keyframes drip{0%{opacity:.9;transform:translateY(0)}100%{opacity:0;transform:translateY(34px)}}
.blink{animation:blink 1.6s steps(1) infinite}
@keyframes blink{50%{opacity:.15}}
.pulse{animation:glow 1.2s ease-in-out 3}
@keyframes glow{50%{filter:drop-shadow(0 0 5px var(--sun)) brightness(1.15)}}
.tether{stroke:var(--rope);stroke-width:.7;stroke-dasharray:2 2;fill:none}
.bln .env{fill:var(--bc)}
.bln .shine{fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;opacity:.6}
.bln .ropes{stroke:var(--ol);stroke-width:.8;fill:none}
.bln .gift{fill:var(--gift)}
.bln .ribbon{fill:none;stroke:var(--bc);stroke-width:2.2}
.bln .ribbon.thin{stroke-width:1.4}
.bln.ghost{opacity:.5}
.bln.ghost .env{filter:saturate(.35)}
.pond-w{transform-box:fill-box;transform-origin:50% 50%}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .45s ease-in-out infinite alternate}
@keyframes flick{to{transform:scale(.88,1.14)}}
.spark{animation:smoke 1.6s ease-out infinite;opacity:0;transform-box:fill-box}
.hop{animation:hop 2s ease-in-out infinite}
@keyframes hop{0%,55%,100%{transform:translateY(0)}70%{transform:translateY(-2.6px)}85%{transform:translateY(0)}}
.stroll{animation:stroll 16s ease-in-out infinite}
@keyframes stroll{0%,8%{transform:translateX(0)}42%,58%{transform:translateX(24px)}92%,100%{transform:translateX(0)}}
.face{transform-box:fill-box;transform-origin:50% 50%;animation:face 16s steps(1) infinite}
@keyframes face{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}}
.eye{transform-box:fill-box;transform-origin:50% 50%;animation:eye 4.5s infinite}
@keyframes eye{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.15)}}
.flap{transform-box:fill-box;transform-origin:50% 50%;animation:flap .28s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleX(.35)}}
.fall{animation:fall 8s linear infinite}
@keyframes fall{from{transform:translate(0,-8px) rotate(0)}to{transform:translate(-34px,262px) rotate(320deg)}}
.rain{animation:rain .7s linear infinite}
@keyframes rain{from{transform:translate(0,-10px)}to{transform:translate(-18px,252px)}}
.burst{opacity:0;animation:burst 1.8s ease-out 4 both}
@keyframes burst{0%{transform:scale(.1);opacity:0}12%,65%{opacity:1}100%{transform:scale(1.3);opacity:0}}
.leap{opacity:0;animation:leap 4.5s ease-in-out infinite}
@keyframes leap{0%,55%{opacity:0;transform:translate(0,4px) rotate(30deg)}60%{opacity:1}70%{transform:translate(5px,-9px) rotate(-10deg)}80%{opacity:1;transform:translate(10px,2px) rotate(-50deg)}86%,100%{opacity:0;transform:translate(10px,4px) rotate(-50deg)}}
.leap-splash{opacity:0;animation:splash 4.5s ease-out infinite}
@keyframes splash{0%,80%{opacity:0}84%{opacity:.9}100%{opacity:0}}
.buzz{animation:buzz 1.6s ease-in-out infinite}
@keyframes buzz{0%,100%{transform:translate(0,0)}25%{transform:translate(3px,-2px)}50%{transform:translate(0,-3px)}75%{transform:translate(-3px,-1px)}}
.drop{opacity:0;animation:drop 6s ease-in infinite}
@keyframes drop{0%,70%{opacity:0;transform:translateY(0)}72%{opacity:1}88%{opacity:1;transform:translateY(14px)}100%{opacity:0;transform:translateY(14px)}}
.jet{transform-box:fill-box;transform-origin:50% 100%;animation:jet 1.1s ease-in-out infinite alternate}
@keyframes jet{to{transform:scaleY(.8)}}
.twinkle{animation:twinkle 2.6s ease-in-out infinite}
.petal{opacity:0;animation:petal 5.4s ease-in infinite}
@keyframes petal{0%{opacity:0;transform:translate(0,0) rotate(0)}10%,82%{opacity:1}100%{opacity:0;transform:translate(-8px,19px) rotate(240deg)}}
.build{animation:grow .7s cubic-bezier(.2,1.3,.4,1) 1.5s both}
.scaffold{pointer-events:none;animation:scaffold 1.9s ease both}
@keyframes scaffold{0%{opacity:0}8%,82%{opacity:1}100%{opacity:0}}
.hammer{transform-box:fill-box;transform-origin:0% 100%;animation:hammer .3s ease-in-out infinite alternate}
@keyframes hammer{from{transform:rotate(-35deg)}to{transform:rotate(15deg)}}
.ding{pointer-events:none;transform-box:fill-box;transform-origin:50% 50%;animation:ding .9s ease-out 1.9s both}
@keyframes ding{0%{opacity:0;transform:scale(.3)}30%{opacity:1}100%{opacity:0;transform:scale(1.5) rotate(90deg)}}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.3}}
.island.cheer .folk{animation:jump .45s ease-in-out 6}
@keyframes jump{50%{transform:translateY(-8px)}}
.confetti{position:absolute;top:-6%;width:7px;height:10px;border-radius:2px;pointer-events:none;animation:confetti 2.8s ease-in forwards}
@keyframes confetti{to{top:104%;transform:translateX(var(--dx)) rotate(var(--r))}}
.bubble{position:absolute;z-index:3;width:max-content;max-width:min(80%,270px);padding:8px 12px 9px;border-radius:16px;background:#FFFDF6;border:1.5px solid var(--ol);color:var(--ink);font-size:calc(13px*var(--fs));line-height:1.5;box-shadow:0 8px 18px -10px rgba(80,60,30,.55);pointer-events:none;transform-origin:var(--ax) 100%;animation:pop .28s cubic-bezier(.2,1.4,.4,1) both}
.bubble.below{transform-origin:var(--ax) 0}
.bubble b{display:block;font-size:calc(11.5px*var(--fs));color:var(--ink-2);margin-bottom:1px}
.bubble::after{content:"";position:absolute;left:calc(var(--ax) - 6px);bottom:-7px;width:11px;height:11px;background:#FFFDF6;border:1.5px solid var(--ol);border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.bubble.below::after{bottom:auto;top:-7px;border-width:1.5px 0 0 1.5px}
@keyframes pop{from{transform:scale(.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.island *{animation:none!important}.island .scaffold,.island .ding{display:none}}
@media (prefers-reduced-motion:reduce){.confetti,.bubble{animation:none!important}.confetti{display:none}}
.beam{opacity:.35;animation:blink 2.4s steps(1) infinite}
.tag rect{fill:var(--tag-bg);stroke:var(--ol);stroke-width:.8} .tag text{fill:var(--tag-fg);font:800 7.5px var(--font-num);text-anchor:middle}

/* budget */
.budget{display:flex;flex-direction:column;gap:10px}
.budget .top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.budget .big{font-size:calc(30px*var(--fs));line-height:1.1}
.bar{height:9px;border-radius:999px;background:var(--surface-2);overflow:hidden;display:flex}
.bar i{display:block;height:100%;border-radius:999px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.foot{display:flex;justify-content:space-between;gap:8px;font-size:calc(12.5px*var(--fs));color:var(--ink-3);flex-wrap:wrap}
.foot b{color:var(--ink);font-family:var(--font-num)}
.inline-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.inline-stats div{background:var(--surface-2);border-radius:12px;padding:8px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:calc(12.5px*var(--fs));color:var(--ink-3)}
.inline-stats .num{font-size:calc(15px*var(--fs))}

/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left}
.row + .row{border-top:1px solid var(--line)}
button.row:active{background:var(--surface-2)}
.row .main{flex:1;min-width:0}
.row .t{display:block;font-size:calc(15px*var(--fs));font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{display:block;font-size:calc(12px*var(--fs));color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{text-align:right;flex-shrink:0}
.row .amt .num{font-size:calc(15.5px*var(--fs));font-weight:800}
.row .amt .s{font-size:calc(11px*var(--fs))}
.tile{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;font-size:calc(19px*var(--fs));background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.empty-row{padding:22px 16px;text-align:center;font-size:calc(13.5px*var(--fs));color:var(--ink-3)}

function totals() {
  const t = { cash:0, credit:0, creditOwed:0, invest:0, prop:0, goal:0, loans:0 };
  S.accounts.forEach(a => {
    if (a.type === 'cash') t.cash += a.value; else if (a.type === 'invest') t.invest += a.value;
    else if (a.type === 'property') t.prop += a.value; else if (a.type === 'loan') t.loans += a.value;
    else if (a.type === 'credit') { if (a.value < 0) t.creditOwed += -a.value; else t.credit += a.value; } });
  S.goals.forEach(g => t.goal += g.saved);
  t.assets = t.cash + t.credit + t.invest + t.prop + t.goal;
  t.debts = t.loans + t.creditOwed;
  t.net = t.assets - t.debts;
  return t;
}
const statExp = t => t.kind === 'expense' && !t.noStat;
const statInc = t => t.kind === 'income' && !t.noStat;
function monthStats(ym = thisYm()) {
  let inc = 0, exp = 0;
  S.txs.forEach(t => { if (t.date.slice(0, 7) !== ym) return; if (statInc(t)) inc += t.amount; else if (statExp(t)) exp += t.amount; });
  const d = new Date(), dim = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(), daysLeft = dim - d.getDate() + 1;
  const left = S.settings.budget - exp;
  return { inc, exp, budget:S.settings.budget, left, daysLeft, perDay: left > 0 ? Math.floor(left / daysLeft) : 0, month:d.getMonth()+1 };
}

/* apply (sign=1) or reverse (sign=-1) a transaction's effect on balances */
const bump = (a, amt, t) => { if (a.cur !== 'USD') { a.value += amt; return; }   // records are in TWD; a US dollar account takes them in dollars at the record's rate
  const rate = t.rate || a.fx || 1; a.usd = +((a.usd || 0) + amt / rate).toFixed(4); a.value = Math.round(a.usd * (a.fx || rate)); };
function applyTx(t, sign = 1) {
  const amt = t.amount * sign;
  if (t.kind === 'expense') { const a = acc(t.from); if (a) bump(a, -amt, t); }
  else if (t.kind === 'income') { const a = acc(t.to); if (a) bump(a, amt, t); }
  else if (t.kind === 'transfer') {
    const a = acc(t.from);
    if (a && a.market && t.shares) tradeTx(a, t, 'sell', sign);
    else if (a) { bump(a, -amt, t); if (a.type === 'invest') a.cost = Math.max(0, (a.cost || 0) - amt); }
    if (String(t.to).startsWith('goal:')) { const g = goal(t.to.slice(5)); if (g) g.saved += amt; }
    else { const b = acc(t.to); if (b) {
      if (b.type === 'loan') b.value -= amt;
      else if (b.type === 'invest' && b.market && t.shares) tradeTx(b, t, 'buy', sign);
      else if (b.type === 'invest') { b.value += amt; b.cost = (b.cost || 0) + amt; }
      else bump(b, amt, t); } }
  }
}
function transferKind(to) {

  const b = acc(to);

}

function islandTips() {

  const day = new Date().getDate(), ym = thisYm();
  const eatOut = y => S.txs.filter(x => statExp(x) && x.item === '外食' && x.date.slice(0, 7) === y && Number(x.date.slice(8)) <= day).reduce((s, x) => s + x.amount, 0);

  if (e1 || e0) tips.push(`這個月外食花了 ${money(e1)}${e0 ? `，比上個月同期${e1 > e0 ? `多 ${money(e1 - e0)}，下一餐要不要自己煮？` : `少 ${money(e0 - e1)}，好棒！`}` : ''}`);
  const byItem = {};
  S.txs.forEach(x => { if (statExp(x) && x.date.slice(0, 7) === ym) byItem[x.item || x.cat] = (byItem[x.item || x.cat] || 0) + x.amount; });
  const top = Object.entries(byItem).sort((a, b) => b[1] - a[1])[0];
  if (top) tips.push(`這個月花最多的是「${esc(top[0])}」，共 ${money(top[1])}`);
  if (m.budget) tips.push(m.left < 0 ? `本月預算已經超支 ${money(-m.left)}，島上下起雨了，接下來省一點吧` : `本月還能花 ${money(m.left)}，平均每天 ${money(m.perDay)}${mood.weather === 'sunny' ? '，天氣真好！' : ''}`);
  const g = S.goals.filter(x => x.target && x.saved < x.target).sort((a, b) => b.saved / b.target - a.saved / a.target)[0];
  if (g) { const need = g.target - g.saved; tips.push(`「${esc(g.name)}」還差 ${money(need)}，每天存 ${money(Math.ceil(need / 180))}，半年就能完成`); }
  if (t.creditOwed > 0) tips.push(`信用卡還有 ${money(t.creditOwed)} 要繳，記得在截止日前繳清喔`);
  tips.push(!mood.streak ? '今天還沒記帳，記一筆島上就會開一朵花' : `已經連續記帳 ${mood.streak} 天，${mood.streak < 7 ? `再 ${7 - mood.streak} 天就放煙火！` : `再 ${30 - mood.streak % 30} 天可以拿到紀念獎盃`}`);
  if (mood.saveRate > 0) tips.push(`最近三個月的儲蓄率是 ${pct(mood.saveRate)}，${mood.saveRate >= .1 ? '海裡的魚越來越多了' : '到 10% 就有島民去碼頭釣魚'}`);
  if (mood.passive > 0) tips.push(`今年的股息和利息有 ${money(mood.passive)}，蜜蜂們很忙喔`);
  const next = MILESTONES.find(([v]) => t.net < v);
  if (next && t.net > 0) tips.push(`淨資產再 ${money(next[0] - t.net)}，島上就會開一間${next[2]}`);
  return tips;
}

      <div class="hbar-sub">${x.items.map(([n, v]) => `<div class="hbar"><span class="nm">${esc(n)}</span><span class="tr"><i style="width:${(v / maxC * 100).toFixed(1)}%;background:var(--c2);opacity:.55"></i></span><span class="v">${fmt(v)}</span></div>`).join('')}</div></details>`).join('')}</div>` : '<p class="note">這段期間沒有支出</p>'}</section>`;

  // 家庭 vs 個人

      <div class="stack" role="img" aria-label="家庭 ${pct(fam / E)}，個人 ${pct(per / E)}">${fam ? `<i style="width:${fam / E * 100}%;background:var(--c1)"></i>` : ''}${per ? `<i style="width:${per / E * 100}%;background:var(--c2)"></i>` : ''}</div></section>`; }

    <tbody>${fixedRows.map(([n, v]) => `<tr><td>${n}</td><td>${fmt(v)}</td>${r.period === 'year' ? `<td>${fmt(v / nMonths)}</td>` : ''}<td>${E ? pct(v / E) : '—'}</td></tr>`).join('')}</tbody>

  }
  return ctrl + kpi + monthly + trend + catCard + split + incCard + fixedCard + payCard + topCard;
}

  let badge = '', sub2 = a.cur === 'USD' ? usdText(a.usd || 0) : '';

    sub = l && l.value > 0 ? `地基：${esc(l.name)} ${wan(l.value)} · 貸款成數 ${pct(l.value / a.value)}` : '無貸款，屋頂插著綠旗'; }

const cashCur = a => a.cur === 'USD' ? 'USD' : 'TWD';
const sameBank = (cur, bank) => byType('cash').filter(a => cashCur(a) === cur && bankOf(a) === bank);
function bankRow(cur, bank, as) {   // two or more accounts at one bank in one currency: one row, tap for the accounts
  const sum = as.reduce((s, a) => s + a.value, 0), usd = as.reduce((s, a) => s + (a.usd || 0), 0);

function cashGroups(list) {   // 台幣資產 and 美金資產, each with its total; accounts at the same bank fold into one row
  return [['台幣資產', 'TWD'], ['美金資產', 'USD']].map(([label, cur]) => { const as = list.filter(a => cashCur(a) === cur); if (!as.length) return '';

    const rows = as.map(a => { const bank = bankOf(a); if (!bank) return accRow(a); if (done.has(bank)) return '';

/* Excel import: same column layout as 2026_記帳模板.xlsx */
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res, rej) => { const s = document.createElement('script');   // the browser refuses the file if it differs from this hash
    s.src = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js'; s.crossOrigin = 'anonymous';
    s.integrity = 'sha384-EnyY0/GSHQGSxSgMwaIPzSESbqoOLSexfnSMN2AP+39Ckmn92stwABZynq1JyzdT';
    s.onload = () => res(window.XLSX); s.onerror = () => rej(new Error('無法載入 Excel 讀取元件，請確認網路連線')); document.head.appendChild(s); });
}
async function parseWorkbook(file) {
  const X = await loadXLSX();
  const wb = X.read(await file.arrayBuffer(), { type:'array' });
  const rows = []; let balances = null;
  const toDate = v => { if (typeof v === 'number') { const d = X.SSF.parse_date_code(v); return `${d.y}-${String(d.m).padStart(2, '0')}-${String(d.d).padStart(2, '0')}`; }
    const s = String(v || '').trim().replace(/\//g, '-'); return /^\d{4}-\d{1,2}-\d{1,2}/.test(s) ? s.split(/[ T]/)[0].split('-').map((p, i) => i ? p.padStart(2, '0') : p).join('-') : ''; };
  wb.SheetNames.forEach(name => {
    const grid = X.utils.sheet_to_json(wb.Sheets[name], { header:1, raw:true, defval:null });
    if (!grid.length || String(grid[0][0] || '').trim() !== '日期') return;
    let n = 0;
    grid.slice(1).forEach(r => { const amt = r[5]; if (amt === null || amt === '' || isNaN(Number(amt))) return; const d = toDate(r[0]); if (!d) return;
      rows.push([d, r[1] || '', r[2] || '', r[3] || '', String(r[4] ?? '').trim(), Number(amt), r[6] || '', r[7] || '']); n++; });
    if (!n) return;
    const at = grid.findIndex(r => String(r[9] || '').trim() === '金流');
    if (at >= 0) { const b = []; for (let i = at + 1; i < grid.length; i++) { const r = grid[i]; if (r[9] && r[9] !== '帳戶' && typeof r[12] === 'number') b.push([String(r[9]).trim(), r[12]]); } if (b.length) balances = b; }
  });
  if (!rows.length) throw new Error('找不到流水帳。工作表的 A1 需要是「日期」，欄位依序為 日期、屬性、類型、項目、備註、金額、From、To');
  return { source:file.name, rows, balances:balances || [] };
}
function replaceWithTemplate(T) {   // keep what the template doesn't know: property, loans, user investments, dreams
  const built = buildFromTemplate(T);
  const keep = S.accounts.filter(a => a.type === 'property' || a.type === 'loan' || (a.type === 'invest' && a.src !== 'template'));
  const keepTx = S.txs.filter(t => String(t.to).startsWith('goal:') || keep.some(a => a.id === t.to || a.id === t.from));
  S = Object.assign({}, S, { v:2, source:T.source, importedAt:today(), accounts:[...built.accounts, ...keep], txs:[...built.txs, ...keepTx.filter(t => !built.txs.some(b => b.id === t.id))] });
  seen = new Set(); firstPaint = true;
  return built;
}

/* backup: on iPhone the share sheet can save it to 檔案 / iCloud 雲碟 or send it via LINE / mail */
async function exportBackup() {
  const name = `財富島備份-${today()}.json`;
  const blob = new Blob([JSON.stringify(S)], { type:'application/json' });
  const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;   // inside the claude.ai viewer, plain downloads are blocked
  if (dl) { try { await dl.save({ filename:name, data:blob }); toast('備份已匯出', name); }
    catch (err) { if (err.code !== 'declined') throw new Error(err.message || err.code); } return; }
  const file =typeof File === 'function' ? new File([blob], name, { type:'application/json' }) : null;
  if (file && navigator.canShare && navigator.canShare({ files:[file] })) { await navigator.share({ files:[file], title:name }); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

}
document.addEventListener('click', e => {
  const tapEl = e.target.closest('[data-tap]');
  const el = e.target.closest('[data-action]');
  if (tapEl && !el) return tapIsland(tapEl.dataset.tap, tapEl);
  if (!el) return;
  const parts = el.dataset.action.split(':'), a = parts[0], arg = parts.slice(1).join(':');
  if (a === 'tab') { ui.tab = arg; render(); window.scrollTo({ top:0 }); }
  if (a === 'quotes') return refreshQuotes(true);
  else if (a === 'record') recordSheet(ui.tab === 'ledger' && ui.ledgerMode === 'cal' ? { date:ui.day } : {});
  else if (a === 'record-today') recordSheet();
  else if (a === 'record-on') recordSheet({ date:arg });
  else if (a === 'add') addSheet(arg || 'cash');
  else if (a === 'acc') accountSheet(arg);
  else if (a === 'bank') { const [cur, bank] = arg.split(':'); bankSheet(cur, decodeURIComponent(bank)); }
  else if (a === 'goal') goalSheet(arg);
  else if (a === 'new-goal') goalSheet(null);
  else if (a === 'deposit') recordSheet({ kind:'transfer', dest:'goal:' + arg });
  else if (a === 'dreams') { ui.tab = 'assets'; ui.assetsView = 'dreams'; render(); window.scrollTo({ top:0 }); }
  else if (a === 'aview') { ui.assetsView = arg; render(); }
  else if (a === 'tx') recordSheet({}, arg);
  else if (a === 'lmode') { ui.ledgerMode = arg; if (arg === 'cal' && ui.f.month === 'all') ui.f.month = thisYm(); render(); }
  else if (a === 'day') { ui.day = arg; refreshLedger(); }
  else if (a === 'cal') { ui.f.month = shiftYm(ui.f.month === 'all' ? thisYm() : ui.f.month, Number(arg)); ui.day = null; refreshLedger(); }
  else if (a === 'more') { ui.limit += 80; refreshLedger(); }
  else if (a === 'clear-filters') { Object.assign(ui.f, { kind:'all', cat:'all', scope:'all', acc:'all', q:'' }); render(); }
  else if (a === 'ledger-acc') { closeSheet(); Object.assign(ui.f, { month:'all', kind:'all', cat:'all', scope:'all', acc:arg, q:'' }); ui.ledgerMode = 'list'; ui.tab = 'ledger'; ui.limit = 80; render(); window.scrollTo({ top:0 }); }
  else if (a === 'settings') settingsSheet();
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.filter) { ui.f[el.dataset.filter] = el.value; ui.limit = 80; el.closest('.sel').classList.toggle('on', el.value !== 'all'); refreshLedger(); }
  if (el.dataset.rep) { ui.rep[el.dataset.rep] = el.value; render(); }
});
let qT;
document.addEventListener('input', e => { if (e.target.id === 'flt-q') { clearTimeout(qT); qT = setTimeout(() => { ui.f.q = e.target.value; ui.limit = 80; refreshLedger(); }, 200); } });
// chart tooltips: hover on desktop, tap on touch
function showTip(hit, ev) {
  const chart = hit.closest('.chart'); if (!chart) return;
  let tip = $('.tip', chart); if (!tip) { tip = document.createElement('div'); tip.className = 'tip'; chart.appendChild(tip); }
  const d = JSON.parse(hit.dataset.tip);
  tip.innerHTML = `<div style="font-weight:700">${esc(d.h)}</div>` + d.rows.map(([c, l, v]) => `<div>${c ? `<i style="background:${c}"></i>` : ''}${esc(l)} <b>${v < 0 ? '−' : ''}${fmt(v)}</b></div>`).join('');
  const box = chart.getBoundingClientRect(), hb = hit.getBoundingClientRect();
  const x = clamp(hb.left + hb.width / 2 - box.left, 70, box.width - 70);
  tip.style.left = x + 'px'; tip.style.top = Math.max(40, (ev && ev.clientY ? ev.clientY - box.top - 8 : hb.top - box.top + 20)) + 'px'; tip.hidden = false;
  $$('.hit.on', chart).forEach(h => h.classList.remove('on')); hit.classList.add('on');
}
document.addEventListener('pointerover', e => { const h = e.target.closest('.hit'); if (h) showTip(h, e); });
document.addEventListener('pointerout', e => { const h = e.target.closest('.hit'); if (h && e.pointerType === 'mouse') { const t = $('.tip', h.closest('.chart')); if (t) t.hidden = true; h.classList.remove('on'); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet-root').hidden) closeSheet(); });
window.addEventListener('scroll', () => $('#topbar').classList.toggle('scrolled', window.scrollY > 4), { passive:true });

$('#ic-home').innerHTML = ic('island', 24, 1.8);
$('#ic-ledger').innerHTML = ic('list', 24, 1.9);
$('#ic-reports').innerHTML = ic('chart', 24, 1.9);
$('#ic-assets').innerHTML = ic('wallet', 24, 1.8);
$('#ic-plus').innerHTML = ic('plus', 26, 2.6);

render();
refreshQuotes();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refreshQuotes(); });
// offline support only in the installable build (build.py adds the manifest link there)
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') &&document.querySelector('link[rel="manifest"]')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
