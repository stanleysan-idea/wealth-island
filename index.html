<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="財富島">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>我的財富島</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#EEF3F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1411" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one iOS column (max 520px) · sticky frosted title bar · tab views (島嶼 / 帳本 / 報表 / 資產) · fixed frosted tab bar with a raised record button */
:root{
  --bg:#EEF3F0; --surface:#FFFFFF; --surface-2:#F4F7F5; --bar:rgba(238,243,240,.78); --glass:rgba(255,255,255,.72);
  --ink:#14211B; --ink-2:#4A5A51; --ink-3:#7E8C84; --line:#DEE6E1; --scrim:rgba(10,20,15,.42);
  --emerald:#16905E; --emerald-deep:#0E7149; --on-em:#FFFFFF; --emerald-soft:#DCF1E7; --emerald-shadow:rgba(22,144,94,.35);
  --sky:#3F97D6; --sky-soft:#DDEEFA; --wood:#A8703F; --wood-soft:#F3E6D8;
  --coral:#DF5C4A; --coral-soft:#FBE6E1; --debt:#78808A; --debt-soft:#E8EBEE; --amber:#C27A12;
  --c1:#2F7FD0; --c2:#D9741C;   /* chart pair (validated: CVD-safe on light surface) */
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  --font-num:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,"Noto Sans TC",system-ui,sans-serif;
  /* island scene */
  --sky-top:#7EC8F2; --sky-bot:#E1F3FB; --sea-top:#5BBDE1; --sea-bot:#2C86BC; --foam:rgba(255,255,255,.75);
  --sand:#EFDCB2; --soil-top:#B88556; --soil-bot:#7D5434; --grass:#7AC66A; --grass-hi:#9EDB88; --grass-lo:#56A958;
  --tree:#3E9954; --tree-hi:#5DB86A; --trunk:#8A5A35; --sun:#FFD25E; --sun-glow:rgba(255,210,94,.28); --cloud:#FFFFFF;
  --wall:#FFF6E8; --roof:#D0573F; --timber:#8B5A33; --window:#A8DBF5; --found:#8C939B; --found-line:#6E757D;
  --turbine:#FFFFFF; --turbine-dim:#C3CAD1; --hub:#5B6B75; --glass-a:#A7DAF5; --glass-b:#4D9BD0;
  --rope:rgba(40,60,50,.45); --star-op:0; --tank-in:#2D5C77; --water:#5BC2F0; --rock:#8E949B; --rock-hi:#B0B6BC;
  --tag-bg:rgba(255,255,255,.88); --tag-fg:#14211B; --hi:#FFFFFF;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C1411; --surface:#151F1A; --surface-2:#1B2721; --bar:rgba(12,20,17,.78); --glass:rgba(21,31,26,.74);
  --ink:#E7EFEA; --ink-2:#AEBDB4; --ink-3:#77877E; --line:#25322B; --scrim:rgba(0,0,0,.55);
  --emerald:#38C287; --emerald-deep:#1F9A66; --on-em:#05140D; --emerald-soft:#123325; --emerald-shadow:rgba(56,194,135,.25);
  --sky:#66B5EA; --sky-soft:#13283A; --wood:#D49C63; --wood-soft:#2D2218;
  --coral:#F27A68; --coral-soft:#3A1F1A; --debt:#9AA2AB; --debt-soft:#252B31; --amber:#E9A84A;
  --c1:#3E8FDF; --c2:#D07A2A;
  --sky-top:#0A1830; --sky-bot:#29496E; --sea-top:#1C4E74; --sea-bot:#0D2A45; --foam:rgba(190,220,255,.35);
  --sand:#9A8865; --soil-top:#6E4D31; --soil-bot:#3E2A19; --grass:#3F8A4F; --grass-hi:#4F9D5D; --grass-lo:#2E6D3D;
  --tree:#2A6D3D; --tree-hi:#3A8550; --trunk:#5E3E25; --sun:#F3EAC4; --sun-glow:rgba(243,234,196,.14); --cloud:rgba(170,190,220,.32);
  --wall:#D8CBB6; --roof:#9A4232; --timber:#5E3E25; --window:#FFD36B; --found:#5E646B; --found-line:#454A50;
  --turbine:#D6DDE4; --turbine-dim:#7B848D; --hub:#AEB8C0; --glass-a:#2A577D; --glass-b:#15314B;
  --rope:rgba(220,230,240,.38); --star-op:1; --tank-in:#0D2435; --water:#3A9FD8; --rock:#5E646B; --rock-hi:#7A828B;
  --tag-bg:rgba(18,28,23,.85); --tag-fg:#E7EFEA; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C1411; --surface:#151F1A; --surface-2:#1B2721; --bar:rgba(12,20,17,.78); --glass:rgba(21,31,26,.74);
  --ink:#E7EFEA; --ink-2:#AEBDB4; --ink-3:#77877E; --line:#25322B; --scrim:rgba(0,0,0,.55);
  --emerald:#38C287; --emerald-deep:#1F9A66; --on-em:#05140D; --emerald-soft:#123325; --emerald-shadow:rgba(56,194,135,.25);
  --sky:#66B5EA; --sky-soft:#13283A; --wood:#D49C63; --wood-soft:#2D2218;
  --coral:#F27A68; --coral-soft:#3A1F1A; --debt:#9AA2AB; --debt-soft:#252B31; --amber:#E9A84A;
  --c1:#3E8FDF; --c2:#D07A2A;
  --sky-top:#0A1830; --sky-bot:#29496E; --sea-top:#1C4E74; --sea-bot:#0D2A45; --foam:rgba(190,220,255,.35);
  --sand:#9A8865; --soil-top:#6E4D31; --soil-bot:#3E2A19; --grass:#3F8A4F; --grass-hi:#4F9D5D; --grass-lo:#2E6D3D;
  --tree:#2A6D3D; --tree-hi:#3A8550; --trunk:#5E3E25; --sun:#F3EAC4; --sun-glow:rgba(243,234,196,.14); --cloud:rgba(170,190,220,.32);
  --wall:#D8CBB6; --roof:#9A4232; --timber:#5E3E25; --window:#FFD36B; --found:#5E646B; --found-line:#454A50;
  --turbine:#D6DDE4; --turbine-dim:#7B848D; --hub:#AEB8C0; --glass-a:#2A577D; --glass-b:#15314B;
  --rope:rgba(220,230,240,.38); --star-op:1; --tank-in:#0D2435; --water:#3A9FD8; --rock:#5E646B; --rock-hi:#7A828B;
  --tag-bg:rgba(18,28,23,.85); --tag-fg:#E7EFEA; color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:16;background:var(--bg)}
/* no visible scrollbars on inner scrollers */
*{scrollbar-width:none} *::-webkit-scrollbar{display:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:-.01em}
.muted{color:var(--ink-3)}
.pos{color:var(--emerald)} .neg{color:var(--coral)}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid transparent;transition:border-color .2s}
.topbar.scrolled{border-bottom-color:var(--line)}
.topbar-in{max-width:520px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px}
.topbar h1{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.topbar .sub{font-size:12px;color:var(--ink-3);font-weight:500}
.topbar .grow1{flex:1;min-width:0}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--ink-2);border:1px solid var(--line);flex-shrink:0}

main{max-width:520px;margin:0 auto;padding-block:6px calc(110px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:6px 4px 0}
.sec-title h2{font-size:17px;font-weight:700}
.sec-title .link{font-size:13px;color:var(--emerald);font-weight:600}
.lbl{font-size:12px;color:var(--ink-3);font-weight:600;letter-spacing:.04em}
.cur{font-size:.6em;font-weight:700;color:var(--ink-3);margin-right:2px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.green{background:var(--emerald-soft);color:var(--emerald)}
.pill.grey{background:var(--debt-soft);color:var(--debt)}
.pill.coral{background:var(--coral-soft);color:var(--coral)}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--surface-2);color:var(--ink-3);vertical-align:2px;margin-left:4px}

/* hint card */
.hint-card{display:flex;gap:12px;align-items:center;background:var(--wood-soft);border-radius:18px;padding:12px 14px;font-size:13px;color:var(--ink-2)}
.hint-card p{flex:1;min-width:0}
.hint-card b{color:var(--ink)}
.mini-btn{flex-shrink:0;font-size:12.5px;font-weight:700;padding:7px 11px;border-radius:999px;background:var(--surface);color:var(--wood);border:1px solid var(--line)}

/* KPI */
.kpi{display:flex;flex-direction:column;gap:14px}
.kpi-net{display:flex;flex-direction:column;gap:2px}
.kpi-net .num{font-size:36px;line-height:1.1}
.kpi-net .cur{font-size:.5em;margin-right:3px}
.krow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi-tile{background:var(--surface-2);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi-tile .num{font-size:18px;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi-tile .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}

/* island */
.island{position:relative;border-radius:24px;overflow:hidden;border:1px solid var(--line);background:var(--sky-bot);box-shadow:0 10px 30px -18px rgba(20,60,40,.45)}
.island svg{display:block;width:100%;height:auto;max-width:100%}
.island .chip-tl{position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--glass);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);color:var(--ink)}
.island .chip-tl i{width:8px;height:8px;border-radius:50%;background:var(--emerald)}
.island .empty-tip{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);font-size:12.5px;font-weight:600;text-align:center;padding:8px 12px;border-radius:14px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:-4px}
.legend button{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2);padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.legend .sw{width:8px;height:8px;border-radius:2px}

.obj{cursor:pointer}
.gw{transform-box:fill-box;transform-origin:50% 100%}
.grow{animation:grow .7s cubic-bezier(.2,1.3,.4,1) both}
.fadein{animation:fadein .8s ease both}
@keyframes grow{from{transform:scale(.01)}to{transform:scale(1)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
[data-ak]{transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.spin{animation:spin linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cloud{animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-90px)}to{transform:translateX(440px)}}
.wave{animation:wave 6s linear infinite}
.wave.b{animation-duration:9s;animation-direction:reverse}
@keyframes wave{from{transform:translateX(-40px)}to{transform:translateX(0)}}
.water-wave{animation:wave2 2.4s linear infinite}
@keyframes wave2{from{transform:translateX(-10px)}to{transform:translateX(0)}}
.sway{animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.float{animation:float 7s ease-in-out infinite}
@keyframes float{0%,100%{transform:translate(0,0)}33%{transform:translate(4px,-6px)}66%{transform:translate(-3px,-2px)}}
.smoke circle{animation:smoke 3.6s ease-out infinite;opacity:0;transform-box:fill-box;transform-origin:center}
.smoke circle:nth-child(2){animation-delay:1.2s}.smoke circle:nth-child(3){animation-delay:2.4s}
@keyframes smoke{0%{opacity:.55;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(6px,-16px) scale(1.6)}}
.drip{animation:drip 1.6s ease-in infinite;opacity:0}
.drip:nth-of-type(2){animation-delay:.55s}.drip:nth-of-type(3){animation-delay:1.1s}
@keyframes drip{0%{opacity:.9;transform:translateY(0)}100%{opacity:0;transform:translateY(34px)}}
.blink{animation:blink 1.6s steps(1) infinite}
@keyframes blink{50%{opacity:.15}}
.pulse{animation:glow 1.2s ease-in-out 3}
@keyframes glow{50%{filter:drop-shadow(0 0 5px var(--sun)) brightness(1.15)}}
.tether{stroke:var(--rope);stroke-width:.7;stroke-dasharray:2 2;fill:none}
.bln .env{fill:var(--bc)}
.bln .stripe{fill:var(--hi);opacity:.3}
.bln .ropes{stroke:var(--rope);stroke-width:.8;fill:none}
.bln .basket{fill:var(--wood)}
.bln.ghost{opacity:.45}
.bln.ghost .env{filter:saturate(.3);stroke:var(--hi);stroke-width:1;stroke-dasharray:3 2}
.tag rect{fill:var(--tag-bg)} .tag text{fill:var(--tag-fg);font:800 7.5px var(--font-num);text-anchor:middle}

/* budget */
.budget{display:flex;flex-direction:column;gap:10px}
.budget .top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.budget .big{font-size:30px;line-height:1.1}
.bar{height:9px;border-radius:999px;background:var(--surface-2);overflow:hidden;display:flex}
.bar i{display:block;height:100%;border-radius:999px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.foot{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink-3);flex-wrap:wrap}
.foot b{color:var(--ink);font-family:var(--font-num)}
.inline-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.inline-stats div{background:var(--surface-2);border-radius:12px;padding:8px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:12.5px;color:var(--ink-3)}
.inline-stats .num{font-size:15px}

/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left}
.row + .row{border-top:1px solid var(--line)}
button.row:active{background:var(--surface-2)}
.row .main{flex:1;min-width:0}
.row .t{display:block;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{display:block;font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{text-align:right;flex-shrink:0}
.row .amt .num{font-size:15.5px;font-weight:800}
.row .amt .s{font-size:11px}
.tile{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;font-size:19px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.empty-row{padding:22px 16px;text-align:center;font-size:13.5px;color:var(--ink-3)}
.day-h{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink-3);padding:8px 6px 6px}
.more-btn{display:block;width:100%;padding:12px;font-size:13.5px;font-weight:700;color:var(--emerald);text-align:center;border-top:1px solid var(--line)}

/* ledger filters (menus) */
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters .wide{grid-column:1 / -1}
.sel{position:relative;min-width:0}
.sel select,.sel input{width:100%;min-width:0;appearance:none;-webkit-appearance:none;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:9px 30px 9px 12px;font-size:16px;font-weight:600;color:var(--ink);outline:0}
.sel input{padding-right:12px;font-weight:500}
.sel select:focus,.sel input:focus{border-color:var(--emerald)}
.sel::after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.sel.noarrow::after{display:none}
.sel.on select{border-color:var(--emerald);background:var(--emerald-soft);color:var(--emerald)}
.result-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink-3);padding:0 4px;flex-wrap:wrap}
.result-bar b{color:var(--ink);font-family:var(--font-num)}
.link-btn{font-size:12.5px;font-weight:700;color:var(--emerald)}

/* calendar */
.cal{display:flex;flex-direction:column;gap:10px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-head h3{font-size:17px;font-weight:800}
.cal-nav{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-wd{text-align:center;font-size:11px;font-weight:700;color:var(--ink-3);padding-bottom:2px}
.cal-day{position:relative;min-height:54px;border-radius:12px;padding:5px 3px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--surface-2);border:1.5px solid transparent;min-width:0}
.cal-day .d{font-size:13px;font-weight:700;color:var(--ink)}
.cal-day .e{font:800 10px var(--font-num);color:var(--ink-2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-day .i{width:5px;height:5px;border-radius:50%;background:var(--c1)}
.cal-day.blank{background:transparent}
.cal-day.today .d{color:var(--emerald)}
.cal-day.sel{border-color:var(--ink)}
.cal-day.wkend .d{color:var(--ink-3)}
.cal-legend{display:flex;gap:12px;font-size:11.5px;color:var(--ink-3);flex-wrap:wrap}
.cal-legend span{display:inline-flex;align-items:center;gap:5px}
.cal-legend i{display:inline-block;width:10px;height:10px;border-radius:3px}

/* reports */
.rep-ctrl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi4 > div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi4 .num{font-size:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi4 small{font-size:11.5px;color:var(--ink-3)}
.chart-card{display:flex;flex-direction:column;gap:10px}
.chart-card h3{font-size:15px;font-weight:700}
.chart-card .sub{font-size:12px;color:var(--ink-3);margin-top:-6px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .axis{font:600 9px var(--font-num);fill:var(--ink-3)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover,.chart .hit.on{fill:var(--ink);opacity:.05}

  for (let v = lo; v <= hi + 1e-6; v += step) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${compact(v)}</text>`;
  const d = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(p.v).toFixed(1)}`).join('');
  g += `<path d="${d}L${x(points.length - 1)} ${T + ph}L${x(0)} ${T + ph}Z" style="fill:var(--c1);opacity:.1"/>`;
  g += `<path d="${d}" style="fill:none;stroke:var(--c1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/>`;
  points.forEach((p, i) => {
    g += `<text class="axis" x="${x(i)}" y="${H - 5}" text-anchor="middle">${p.label}</text>`;
    const last = i === points.length - 1;
    if (last) g += `<circle cx="${x(i)}" cy="${y(p.v)}" r="4.5" style="fill:var(--c1);stroke:var(--surface);stroke-width:2"/><text x="${x(i) - 6}" y="${y(p.v) - 9}" text-anchor="end" style="font:800 10px var(--font-num);fill:var(--ink)">${compact(p.v)}</text>`;
    const bw = points.length > 1 ? pw / (points.length - 1) : pw;
    g += `<rect class="hit" x="${x(i) - bw / 2}" y="${T}" width="${bw}" height="${ph}" data-tip="${esc(JSON.stringify({ h:p.label + ' 月底', rows:[['var(--c1)', '帳戶總額', p.v]] }))}"/>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="帳戶總額走勢">${g}</svg></div>`;
}
const hbarList = (items, color, total) => { const max = Math.max(1, ...items.map(i => i[1]));
  return `<div class="hbars">${items.map(([n, v]) => `<div class="hbar"><span class="nm">${esc(n)}</span><span class="tr"><i style="width:${(v / max * 100).toFixed(1)}%;background:${color}"></i></span><span class="v">${fmt(v)}<small>${total ? pct(v / total) : ''}</small></span></div>`).join('')}</div>`; };

const inFlowTotal = a => a && (a.type === 'cash' || (a.type === 'invest' && a.src === 'template'));   // the template's 金流 accounts minus credit cards
function flowEffect(t) {   // how a record moved the 現金與銀行 total (same scope as the template's 總金額, which leaves out credit cards)
  const isCash = inFlowTotal;
  const fa = acc(t.from), ta = t.to && !String(t.to).startsWith('goal:') ? acc(t.to) : null;
  if (t.kind === 'expense') return isCash(fa) ? -t.amount : 0;
  if (t.kind === 'income') return isCash(ta) ? t.amount : 0;
  return (isCash(ta) ? t.amount : 0) - (isCash(fa) ? t.amount : 0);
}
function viewReports() {
  const r = ui.rep, months = monthsWithData(), year = thisYm().slice(0, 4);
  const inPeriod = t => r.period === 'year' ? t.date.slice(0, 4) === year : t.date.slice(0, 7) === r.period;
  const inScope = t => r.scope === 'all' || t.scope === r.scope;
  const tx = S.txs.filter(t => inPeriod(t) && inScope(t));
  const exps = tx.filter(statExp), incs = tx.filter(statInc);
  const E = exps.reduce((s, t) => s + t.amount, 0), I = incs.reduce((s, t) => s + t.amount, 0), net = I - E;
  const ctrl = `<div class="rep-ctrl">

    ${selectBox('rep-scope', [['all', '家庭＋個人'], ...SCOPES.map(s => [s, s + '花費'])], r.scope, 'data-rep="scope" aria-label="屬性"', r.scope !== 'all' ? 'on' : '')}</div>`;
  const nMonths = r.period === 'year' ? new Set(tx.map(t => t.date.slice(0, 7))).size || 1 : 1;

    <div><span class="lbl">收入</span><span class="num">${money(I)}</span>${r.period === 'year' ? `<small>月平均 ${money(I / nMonths)}</small>` : ''}</div>
    <div><span class="lbl">支出</span><span class="num">${money(E)}</span>${r.period === 'year' ? `<small>月平均 ${money(E / nMonths)}</small>` : ''}</div>
    <div><span class="lbl">結餘</span><span class="num ${net < 0 ? 'neg' : ''}">${money(net)}</span></div>
    <div><span class="lbl">儲蓄率</span><span class="num">${I ? pct(net / I) : '—'}</span><small>結餘 ÷ 收入</small></div></div>`;

  // monthly table / columns (year view)
  let monthly = '';
  if (r.period === 'year') {
    const rows = []; const maxM = Number(thisYm().slice(5));
    for (let m = 1; m <= maxM; m++) { const ym = `${year}-${String(m).padStart(2, '0')}`;
      const mt = tx.filter(t => t.date.slice(0, 7) === ym);
      rows.push({ m, inc:mt.filter(statInc).reduce((s, t) => s + t.amount, 0), exp:mt.filter(statExp).reduce((s, t) => s + t.amount, 0) }); }
    monthly = `<section class="card chart-card"><h3>每月收入與支出</h3><p class="sub">點長條看當月收入、支出與結餘</p>
      <div class="key"><span><i style="background:var(--c1)"></i>收入</span><span><i style="background:var(--c2)"></i>支出</span></div>
      ${monthlyColumns(rows)}
      <details class="tview"><summary>查看月份明細表</summary><div class="tbl-wrap"><table class="tbl"><thead><tr><th>月份</th><th>收入</th><th>支出</th><th>結餘</th></tr></thead>
      <tbody>${rows.map(x => `<tr><td>${x.m} 月</td><td>${fmt(x.inc)}</td><td>${fmt(x.exp)}</td><td class="${x.inc - x.exp < 0 ? 'neg' : ''}">${x.inc - x.exp < 0 ? '−' : ''}${fmt(x.inc - x.exp)}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>合計</td><td>${fmt(I)}</td><td>${fmt(E)}</td><td class="${net < 0 ? 'neg' : ''}">${net < 0 ? '−' : ''}${fmt(net)}</td></tr></tfoot></table></div></details></section>`;
  }

  // category breakdown with item drill-down
  const byCat = CATS.map(c => { const ce = exps.filter(t => t.cat === c.key); const items = {};
    ce.forEach(t => items[t.item] = (items[t.item] || 0) + t.amount);
    return { c, v:ce.reduce((s, t) => s + t.amount, 0), items:Object.entries(items).sort((a, b) => b[1] - a[1]) }; }).filter(x => x.v > 0).sort((a, b) => b.v - a.v);
  const maxC = Math.max(1, ...byCat.map(x => x.v));
  const catCard = `<section class="card chart-card"><h3>支出類型分布</h3><p class="sub">點類型展開項目明細</p>
    ${byCat.length ? `<div class="hbars">${byCat.map(x => `<details class="cat-detail"><summary class="hbar"><span class="nm">${x.c.emo} ${x.c.key}</span><span class="tr"><i style="width:${(x.v / maxC * 100).toFixed(1)}%;background:var(--c2)"></i></span><span class="v">${fmt(x.v)}<small>${pct(x.v / E)}</small></span></summary>
      <div class="hbar-sub">${x.items.map(([n, v]) => `<div class="hbar"><span class="nm">${esc(n)}</span><span class="tr"><i style="width:${(v / maxC * 100).toFixed(1)}%;background:var(--c2);opacity:.55"></i></span><span class="v">${fmt(v)}</span></div>`).join('')}</div></details>`).join('')}</div>` : '<p class="note">這段期間沒有支出</p>'}</section>`;

  // 家庭 vs 個人
  let split = '';
  if (r.scope === 'all' && E) { const fam = exps.filter(t => t.scope === '家庭').reduce((s, t) => s + t.amount, 0), per = E - fam;
    split = `<section class="card chart-card"><h3>家庭與個人花費</h3>
      <div class="key"><span><i style="background:var(--c1)"></i>家庭 <b class="num">${money(fam)}</b>（${pct(fam / E)}）</span><span><i style="background:var(--c2)"></i>個人 <b class="num">${money(per)}</b>（${pct(per / E)}）</span></div>
      <div class="stack" role="img" aria-label="家庭 ${pct(fam / E)}，個人 ${pct(per / E)}">${fam ? `<i style="width:${fam / E * 100}%;background:var(--c1)"></i>` : ''}${per ? `<i style="width:${per / E * 100}%;background:var(--c2)"></i>` : ''}</div></section>`; }

  // income sources
  const incBy = {}; incs.forEach(t => incBy[t.item] = (incBy[t.item] || 0) + t.amount);
  const incCard = `<section class="card chart-card"><h3>收入來源</h3>${I ? hbarList(Object.entries(incBy).sort((a, b) => b[1] - a[1]), 'var(--c1)', I) : '<p class="note">這段期間沒有收入</p>'}</section>`;

  // fixed expenses (matched by 備註, like the template's 固定支出 table)
  const fixedRows = FIXED.map(([label, keys]) => [label, exps.filter(t => keys.includes(t.note)).reduce((s, t) => s + t.amount, 0)]);
  const fixedTotal = fixedRows.reduce((s, x) => s + x[1], 0);
  const fixedCard = `<section class="card chart-card"><h3>固定支出</h3><p class="sub">依備註比對：房貸、水電瓦斯網路手機、管理費、車貸</p>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>項目</th><th>金額</th>${r.period === 'year' ? '<th>月平均</th>' : ''}<th>佔支出</th></tr></thead>
    <tbody>${fixedRows.map(([n, v]) => `<tr><td>${n}</td><td>${fmt(v)}</td>${r.period === 'year' ? `<td>${fmt(v / nMonths)}</td>` : ''}<td>${E ? pct(v / E) : '—'}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td>小計</td><td>${fmt(fixedTotal)}</td>${r.period === 'year' ? `<td>${fmt(fixedTotal / nMonths)}</td>` : ''}<td>${E ? pct(fixedTotal / E) : '—'}</td></tr></tfoot></table></div></section>`;

  // payment accounts
  const payBy = {}; exps.filter(t => t.from).forEach(t => { const n = accName(t.from); payBy[n] = (payBy[n] || 0) + t.amount; });
  const payCard = `<section class="card chart-card"><h3>付款帳戶</h3><p class="sub">支出從哪個帳戶或信用卡付出</p>${E ? hbarList(Object.entries(payBy).sort((a, b) => b[1] - a[1]).slice(0, 8), 'var(--ink-3)', E) : '<p class="note">這段期間沒有支出</p>'}</section>`;

  // top single expenses
  const top = [...exps].sort((a, b) => b.amount - a.amount).slice(0, 5);
  const topCard = `<div class="sec-title"><h2>單筆最大支出</h2></div><div class="list">${top.length ? top.map(txRow).join('') : '<div class="empty-row">沒有支出</div>'}</div>`;

  // account total trend, rebuilt backwards from today's balances
  let trend = '';
  if (r.period === 'year') {
    const flowNow = S.accounts.filter(inFlowTotal).reduce((s, a) => s + a.value, 0);
    const pts = []; const maxM = Number(thisYm().slice(5));
    for (let m = 1; m <= maxM; m++) { const end = ymd(new Date(Number(year), m, 0));
      const after = S.txs.filter(t => t.date > end).reduce((s, t) => s + flowEffect(t), 0);
      pts.push({ label:`${m}`, v:flowNow - after }); }
    trend = `<section class="card chart-card"><h3>帳戶總金額</h3><p class="sub">每月底的現金、銀行、電子錢包與保單（同 Excel「金流」總金額，不含信用卡），由目前餘額依流水帳回推</p>${lineChart(pts)}</section>`;
  }
  return ctrl + kpi + monthly + trend + catCard + split + incCard + fixedCard + payCard + topCard;
}

/* ───────── assets & dreams ───────── */
function accRow(a) {
  let sub = '', right = money(a.value), under = '', color = '';
  if (a.type === 'cash') { const t = totals(); sub = `佔蓄水池 ${pct(t.cash ? a.value / t.cash : 0)}`; }
  if (a.type === 'credit') { sub = a.value < 0 ? '未繳金額，算在負債' : a.value > 0 ? '溢繳（可抵下期）' : '已繳清'; color = a.value < 0 ? 'var(--debt)' : ''; }
  if (a.type === 'invest') { const g = a.cost ? (a.value - a.cost) / a.cost : 0;
    sub = `${a.kind === 'stock' ? '風車' : '科技大樓'} · 成本 ${wan(a.cost || 0)}`;
    if (a.cost) under = `<span class="s ${g >= 0 ? 'pos' : 'neg'}" style="font-weight:700">${g >= 0 ? '+' : ''}${(g * 100).toFixed(1)}%</span>`; }
  if (a.type === 'property') { const l = loanOf(a);
    sub = l && l.value > 0 ? `地基：${esc(l.name)} ${wan(l.value)} · 貸款成數 ${pct(l.value / a.value)}` : '無貸款，屋頂插著綠旗'; }
  if (a.type === 'loan') { const p = acc(a.propertyId); sub = p ? `壓在「${esc(p.name)}」底下的地基` : '海邊的灰色岩石'; right = '−' + money(a.value); color = 'var(--debt)'; }
  return `<button class="row" data-action="acc:${a.id}">${typeTile(a.type)}<span class="main"><span class="t">${esc(a.name)}</span><span class="s">${sub}</span></span>
    <span class="amt"><span class="num" style="${color ? 'color:' + color : ''}">${right}</span>${under}</span></button>`;
}
function viewAssets() {
  const seg = `<div class="seg"><button data-action="aview:list" class="${ui.assetsView === 'list' ? 'on' : ''}">資產與負債</button><button data-action="aview:dreams" class="${ui.assetsView === 'dreams' ? 'on' : ''}">夢想目標</button></div>`;

const TITLES = { home:null, ledger:'帳本', reports:'財務報表', assets:'資產與夢想' };
function render() {
  const d = new Date();

  $('#subtitle').textContent = ui.tab === 'home' ? `${d.getFullYear()} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日 週${WD[d.getDay()]}` :

function runAnims() {
  const els = $$('[data-ak]');
  if (!els.length) return;

}
function commit(hl = []) { save(); highlight = hl; render(); }

/* ───────── sheets ───────── */
let sheetGen = 0;
function openSheet(html, mount) {
  const root = $('#sheet-root'); const gen = ++sheetGen;
  root.innerHTML = `<div class="backdrop" data-close></div><div class="sheet" role="dialog" aria-modal="true"><div class="grabber"></div>${html}</div>`;
  root.hidden = false; root.classList.remove('open');
  void root.offsetHeight; root.classList.add('open');
  $$('[data-close]', root).forEach(b => b.addEventListener('click', closeSheet));
  if (mount) mount($('.sheet', root));
}
function closeSheet() {
  const root = $('#sheet-root'); const gen = ++sheetGen;
  root.classList.remove('open');
  setTimeout(() => { if (gen === sheetGen) { root.hidden = true; root.innerHTML = ''; } }, 320);
}
const head = title => `<div class="sheet-head"><h2>${title}</h2><button class="icon-btn" data-close aria-label="關閉">${ic('close', 16, 2.4)}</button></div>`;
function armDelete(btn, armedLabel, fn) {
  const orig = btn.textContent;
  btn.addEventListener('click', () => {
    if (btn.dataset.armed) return fn();
    btn.dataset.armed = '1'; btn.classList.add('armed'); btn.textContent = armedLabel;
    setTimeout(() => { delete btn.dataset.armed; btn.classList.remove('armed'); btn.textContent = orig; }, 4000);
  });
}
function showErr(sh, msg) { const e = $('.err', sh); e.textContent = msg; e.hidden = false; }

let toastT;
function toast(main, sub = '') {
  const el = $('#toast'); el.innerHTML = esc(main) + (sub ? `<small>${esc(sub)}</small>` : '');
  el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 3600);
}

/* new / edit record — every field is a menu, like the template's 屬性・類型・項目・From・To columns */
const accOpt = a => [a.id, `${a.name}（${a.type === 'credit' ? (a.value < 0 ? '未繳 ' + money(-a.value) : '信用卡') : money(a.value)}）`];
function recordSheet(pre = {}, editId = null) {
  const old = editId ? S.txs.find(t => t.id === editId) : null;
  const pays = payAccounts();
  if (!pays.length) { toast('先新增一個現金帳戶', '記帳要從帳戶扣款或入帳'); addSheet('cash'); return; }
  const lastExp = [...S.txs].sort(sortTx).find(t => t.kind === 'expense');
  const cashFirst = byType('cash')[0] || pays[0];
  const f = Object.assign({ kind:'expense', amount:'', date:today(), scope:lastExp?.scope || '個人', cat:'食', item:'外食', from:lastExp?.from || pays[0].id,
    income:'薪資', payer:'', to:cashFirst.id, tfrom:cashFirst.id, dest:'', note:'', noStat:false, refund:false }, pre);
  if (old) Object.assign(f, { kind:old.kind, amount:String(Math.abs(old.amount)), refund:old.kind === 'expense' && old.amount < 0, date:old.date, scope:old.scope || '個人', note:old.note || '', noStat:!!old.noStat },

function recPreview(f, old) {
  const amt = parseInt(f.amount, 10) || 0;

  // "before" is what the island shows now; "after" is with the edited record (if any) swapped for this one
  const cur = {}; S.accounts.forEach(a => cur[a.id] = a.value);
  const w0 = waterLevel(totals().cash), m0 = monthStats();
  if (old) applyTx(old, -1);
  const t = totals(), lines = [];
  const step = (label, a, b, show = x => x) => { if (old && show(a) === show(b)) return; lines.push(`${label} <b>${show(a)}</b> → <b>${show(b)}</b>`); };
  const line = (a, delta) => { if (!a) return; step(esc(a.name), cur[a.id], a.value + delta, money);
    if (a.type === 'cash' && a.value + delta < 0) lines.push('<span class="warn">餘額會變成負數，請確認帳戶是否正確</span>'); };
  const water = delta => step('蓄水池水位', w0, waterLevel(t.cash + delta), pctW);
  const oldExp = old && statExp(old) && old.date.slice(0, 7) === thisYm() ? old.amount : 0;   // monthStats still counts the record being edited
  const month = delta => { const inMonth = !f.noStat && f.date.slice(0, 7) === thisYm(); step('本月可支配', m0.left, m0.left + oldExp + (inMonth ? delta : 0), money); };
  if (f.kind === 'expense') { const a = acc(f.from), sign = f.refund ? 1 : -1; line(a, sign * amt);
    if (a?.type === 'cash') water(sign * amt);
    if (a?.type === 'credit' && !f.refund) lines.push('刷卡會增加卡債，島邊的岩石會變大');
    month(sign * amt); }
  else if (f.kind === 'income') { const a = acc(f.to); line(a, amt); if (a?.type === 'cash') water(amt); }
  else { const a = acc(f.tfrom); line(a, -amt);
    if (a?.type === 'cash') water(-amt);
    if (String(f.dest).startsWith('goal:')) { const g = goal(f.dest.slice(5)), p0 = g.saved / g.target, p1 = (g.saved + amt) / g.target;
      lines.push(`熱氣球「${esc(g.name)}」 <b>${pct(p0)}</b> → <b>${pct(p1)}</b>${p0 < 1 && p1 >= 1 ? '，會升空！' : p0 < .5 && p1 >= .5 ? '，會變鮮豔' : ''}`); }
    else { const b = acc(f.dest);
      if (b?.type === 'loan') lines.push(`「${esc(b.name)}」剩餘 <b>${wan(cur[b.id])}</b> → <b>${wan(Math.max(0, b.value - amt))}</b>${b.propertyId ? '，地基變薄' : '，岩石縮小'}`);
      else if (b) { line(b, amt); if (b.type === 'cash') water(amt); } } }
  if (old) applyTx(old, 1);
  if (old && !lines.length) lines.push('金額和帳戶沒有變動，儲存後只會更新內容');

}
function saveRecord(f, sh, old) {
  const amt = parseInt(f.amount, 10) || 0;
  if (!amt) return showErr(sh, '請輸入金額');
  const tx = { id:old ? old.id : uid(), kind:f.kind, amount:amt, date:f.date || today(), note:(f.note || '').trim(), ts:old ? old.ts : Date.now() };
  if (f.kind === 'expense') { if (!acc(f.from) && !f.refund) return showErr(sh, '請選擇付款帳戶');
    Object.assign(tx, { scope:f.scope, cat:f.cat, item:f.item, from:f.from || '' }); if (f.refund) { tx.amount = -amt; if (!f.from && f.payer) tx.payer = f.payer; } }
  if (f.kind === 'income') { if (!acc(f.to)) return showErr(sh, '請選擇存入帳戶'); Object.assign(tx, { scope:f.scope, item:f.income, payer:f.payer.trim(), to:f.to }); }
  if (f.kind === 'transfer') {
    if (!acc(f.tfrom)) return showErr(sh, '請選擇轉出帳戶');
    if (!f.dest) return showErr(sh, '請選擇轉入的地方');
    if (f.dest === f.tfrom) return showErr(sh, '轉出和轉入不能是同一個帳戶');
    Object.assign(tx, { from:f.tfrom, to:f.dest });
  }
  if (f.noStat && f.kind !== 'transfer') tx.noStat = true;
  const w0 = waterLevel(totals().cash);
  if (old) applyTx(old, -1);
  const b = tx.kind === 'transfer' ? acc(tx.to) : null;
  if (b && b.type === 'loan' && amt > b.value) { if (old) applyTx(old, 1); return showErr(sh, `還款金額超過「${b.name}」剩餘的 ${money(b.value)}`); }
  applyTx(tx, 1);
  if (old) Object.keys(old).forEach(k => delete old[k]), Object.assign(old, tx); else S.txs.push(tx);
  const w1 = waterLevel(totals().cash), hl = ['cash'];
  let msg, sub = pctW(w0) !== pctW(w1) ? `蓄水池水位 ${pctW(w0)} → ${pctW(w1)}` : '';
  if (tx.kind === 'expense') { msg = `${old ? '已更新' : '記下'} ${tx.note || tx.item} ${tx.amount < 0 ? '退款 +' : '−'}${money(amt)}`; if (tx.amount > 0 && acc(tx.from)?.type === 'credit') { hl.push('credit'); sub = `${acc(tx.from).name} 刷卡，島邊的卡債岩石變大`; } }
  else if (tx.kind === 'income') msg = `${old ? '已更新' : ''}${tx.item} +${money(amt)} 存入 ${accName(tx.to)}`;
  else { const k = transferKind(tx.to); msg = `${old ? '已更新 ' : ''}${k.label} ${money(amt)} → ${destName(tx.to)}`;
    if (tx.to.startsWith('goal:')) { const g = goal(tx.to.slice(5)); hl.push('goal:' + g.id); const p = g.saved / g.target; sub = p >= 1 ? '熱氣球升空了！' : `熱氣球進度 ${pct(p)}`; }
    else { hl.push('acc:' + tx.to); if (b?.propertyId) hl.push('acc:' + b.propertyId); if (b?.type === 'credit') hl.push('credit'); } }
  if (tx.date !== today() && ui.tab === 'ledger' && ui.ledgerMode === 'cal') ui.day = tx.date;
  closeSheet(); commit(hl); toast(msg, sub);
}

/* Excel import: same column layout as 2026_記帳模板.xlsx */
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res, rej) => { const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => res(window.XLSX); s.onerror = () => rej(new Error('無法載入 Excel 讀取元件，請確認網路連線')); document.head.appendChild(s); });
}
async function parseWorkbook(file) {
  const X = await loadXLSX();
  const wb = X.read(await file.arrayBuffer(), { type:'array' });
  const rows = []; let balances = null;
  const toDate = v => { if (typeof v === 'number') { const d = X.SSF.parse_date_code(v); return `${d.y}-${String(d.m).padStart(2, '0')}-${String(d.d).padStart(2, '0')}`; }
    const s = String(v || '').trim().replace(/\//g, '-'); return /^\d{4}-\d{1,2}-\d{1,2}/.test(s) ? s.split(/[ T]/)[0].split('-').map((p, i) => i ? p.padStart(2, '0') : p).join('-') : ''; };
  wb.SheetNames.forEach(name => {
    const grid = X.utils.sheet_to_json(wb.Sheets[name], { header:1, raw:true, defval:null });
    if (!grid.length || String(grid[0][0] || '').trim() !== '日期') return;
    let n = 0;
    grid.slice(1).forEach(r => { const amt = r[5]; if (amt === null || amt === '' || isNaN(Number(amt))) return; const d = toDate(r[0]); if (!d) return;
      rows.push([d, r[1] || '', r[2] || '', r[3] || '', String(r[4] ?? '').trim(), Number(amt), r[6] || '', r[7] || '']); n++; });
    if (!n) return;
    const at = grid.findIndex(r => String(r[9] || '').trim() === '金流');
    if (at >= 0) { const b = []; for (let i = at + 1; i < grid.length; i++) { const r = grid[i]; if (r[9] && r[9] !== '帳戶' && typeof r[12] === 'number') b.push([String(r[9]).trim(), r[12]]); } if (b.length) balances = b; }
  });
  if (!rows.length) throw new Error('找不到流水帳。工作表的 A1 需要是「日期」，欄位依序為 日期、屬性、類型、項目、備註、金額、From、To');
  return { source:file.name, rows, balances:balances || [] };
}
function replaceWithTemplate(T) {   // keep what the template doesn't know: property, loans, user investments, dreams
  const built = buildFromTemplate(T);
  const keep = S.accounts.filter(a => a.type === 'property' || a.type === 'loan' || (a.type === 'invest' && a.src !== 'template'));
  const keepTx = S.txs.filter(t => String(t.to).startsWith('goal:') || keep.some(a => a.id === t.to || a.id === t.from));
  S = Object.assign({}, S, { v:2, source:T.source, importedAt:today(), accounts:[...built.accounts, ...keep], txs:[...built.txs, ...keepTx.filter(t => !built.txs.some(b => b.id === t.id))] });
  seen = new Set(); firstPaint = true;
  return built;
}

/* backup: on iPhone the share sheet can save it to 檔案 / iCloud 雲碟 or send it via LINE / mail */
async function exportBackup() {
  const name = `財富島備份-${today()}.json`;
  const blob = new Blob([JSON.stringify(S)], { type:'application/json' });
  const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;   // inside the claude.ai viewer, plain downloads are blocked
  if (dl) { try { await dl.save({ filename:name, data:blob }); toast('備份已匯出', name); }
    catch (err) { if (err.code !== 'declined') throw new Error(err.message || err.code); } return; }
  const file =typeof File === 'function' ? new File([blob], name, { type:'application/json' }) : null;
  if (file && navigator.canShare && navigator.canShare({ files:[file] })) { await navigator.share({ files:[file], title:name }); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

    sh.addEventListener('input', e => { const n = e.target.name; if (!n) return; if (e.target.dataset.money !== undefined) e.target.value = digits(e.target.value); f[n] = e.target.value; });
    $('#set-save', sh).addEventListener('click', () => {

      if (fw <= 0) return showErr(sh, '滿水位要大於 0');

        S = Object.assign(emptyState(), s, { settings:Object.assign(emptyState().settings, s.settings), goals:s.goals || [] });
        seen = new Set(); firstPaint = true; closeSheet(); ui.tab = 'home'; commit(); toast('已還原備份', `${S.txs.length.toLocaleString()} 筆紀錄、${S.accounts.length} 個帳戶`); }
      catch (err) { showErr(sh, err instanceof SyntaxError ? '檔案格式錯誤，請選擇匯出的 .json 備份檔' : err.message); }
    });

  });
}

/* ───────── global events ───────── */
document.addEventListener('click', e => {
  const tapEl = e.target.closest('[data-tap]');
  const el = e.target.closest('[data-action]');
  if (tapEl && !el) {
    const k = tapEl.dataset.tap;
    if (k === 'cash') return cashSheet();
    if (k === 'credit') return creditSheet();
    if (k.startsWith('acc:')) return accountSheet(k.slice(4));
    if (k.startsWith('goal:')) return goalSheet(k.slice(5));
  }
  if (!el) return;
  const parts = el.dataset.action.split(':'), a = parts[0], arg = parts.slice(1).join(':');
  if (a === 'tab') { ui.tab = arg; render(); window.scrollTo({ top:0 }); }
  else if (a === 'record') recordSheet(ui.tab === 'ledger' && ui.ledgerMode === 'cal' ? { date:ui.day } : {});
  else if (a === 'record-today') recordSheet();
  else if (a === 'record-on') recordSheet({ date:arg });
  else if (a === 'add') addSheet(arg || 'cash');
  else if (a === 'acc') accountSheet(arg);
  else if (a === 'goal') goalSheet(arg);
  else if (a === 'new-goal') goalSheet(null);
  else if (a === 'deposit') recordSheet({ kind:'transfer', dest:'goal:' + arg });
  else if (a === 'dreams') { ui.tab = 'assets'; ui.assetsView = 'dreams'; render(); window.scrollTo({ top:0 }); }
  else if (a === 'aview') { ui.assetsView = arg; render(); }
  else if (a === 'tx') recordSheet({}, arg);
  else if (a === 'lmode') { ui.ledgerMode = arg; if (arg === 'cal' && ui.f.month === 'all') ui.f.month = thisYm(); render(); }
  else if (a === 'day') { ui.day = arg; refreshLedger(); }
  else if (a === 'cal') { ui.f.month = shiftYm(ui.f.month === 'all' ? thisYm() : ui.f.month, Number(arg)); ui.day = null; refreshLedger(); }
  else if (a === 'more') { ui.limit += 80; refreshLedger(); }
  else if (a === 'clear-filters') { Object.assign(ui.f, { kind:'all', cat:'all', scope:'all', acc:'all', q:'' }); render(); }
  else if (a === 'ledger-acc') { closeSheet(); Object.assign(ui.f, { month:'all', kind:'all', cat:'all', scope:'all', acc:arg, q:'' }); ui.ledgerMode = 'list'; ui.tab = 'ledger'; ui.limit = 80; render(); window.scrollTo({ top:0 }); }
  else if (a === 'settings') settingsSheet();
});

// chart tooltips: hover on desktop, tap on touch
function showTip(hit, ev) {
  const chart = hit.closest('.chart'); if (!chart) return;
  let tip = $('.tip', chart); if (!tip) { tip = document.createElement('div'); tip.className = 'tip'; chart.appendChild(tip); }
  const d = JSON.parse(hit.dataset.tip);
  tip.innerHTML = `<div style="font-weight:700">${esc(d.h)}</div>` + d.rows.map(([c, l, v]) => `<div>${c ? `<i style="background:${c}"></i>` : ''}${esc(l)} <b>${v < 0 ? '−' : ''}${fmt(v)}</b></div>`).join('');
  const box = chart.getBoundingClientRect(), hb = hit.getBoundingClientRect();
  const x = clamp(hb.left + hb.width / 2 - box.left, 70, box.width - 70);
  tip.style.left = x + 'px'; tip.style.top = Math.max(40, (ev && ev.clientY ? ev.clientY - box.top - 8 : hb.top - box.top + 20)) + 'px'; tip.hidden = false;
  $$('.hit.on', chart).forEach(h => h.classList.remove('on')); hit.classList.add('on');
}
document.addEventListener('pointerover', e => { const h = e.target.closest('.hit'); if (h) showTip(h, e); });
document.addEventListener('pointerout', e => { const h = e.target.closest('.hit'); if (h && e.pointerType === 'mouse') { const t = $('.tip', h.closest('.chart')); if (t) t.hidden = true; h.classList.remove('on'); } });
